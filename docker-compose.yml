services:
  # Next.js Full-Stack Application (UI & Orchestration API Routes)
  next-app:
    build:
      context: ./next-app
      dockerfile: Dockerfile
    container_name: verified-rag-next
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - EMBED_SERVICE_URL=http://embed-service:8001
      - RERANK_SERVICE_URL=http://rerank-service:8002
      - VERIFICATION_SERVICE_URL=http://verification-service:8003
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      embed-service:
        condition: service_healthy
      rerank-service:
        condition: service_healthy
      verification-service:
        condition: service_healthy
    networks:
      - rag-network

  # Microservice 1: Vector Embeddings (MiniLM / BGE / API)
  embed-service:
    build:
      context: ./embed-service
      dockerfile: Dockerfile
    container_name: verified-rag-embed
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rag-network

  # Microservice 2: Cross-Encoder Reranker
  rerank-service:
    build:
      context: ./rerank-service
      dockerfile: Dockerfile
    container_name: verified-rag-rerank
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - MODEL_NAME=cross-encoder/ms-marco-MiniLM-L-6-v2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rag-network

  # Microservice 3: NLI Claim Verification & Hallucination Scoring
  verification-service:
    build:
      context: ./verification-service
      dockerfile: Dockerfile
    container_name: verified-rag-verify
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - MODEL_NAME=cross-encoder/nli-deberta-v3-base
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
